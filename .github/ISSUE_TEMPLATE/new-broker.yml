name: New broker
description: Propose a public removal route for research.
title: "broker: "
labels:
  - adapter
  - research
body:
  - type: markdown
    attributes:
      value: |
        Do not search for or submit anyone's record while preparing this issue.
        Include public company and privacy-policy information only.

  - type: input
    id: name
    attributes:
      label: Broker or service name
    validations:
      required: true

  - type: input
    id: homepage
    attributes:
      label: Public homepage
    validations:
      required: true

  - type: input
    id: removal-url
    attributes:
      label: Public privacy or removal URL
    validations:
      required: true

  - type: textarea
    id: jurisdictions
    attributes:
      label: Stated jurisdictions and eligibility
      description: Quote sparingly and link the primary policy source.
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I used only public business information and included no PII.
          required: true
