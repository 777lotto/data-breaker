<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Synthetic Broker Removal</title>
    <style>
      body {
        color: #17202a;
        font-family: system-ui, sans-serif;
        margin: 2rem auto;
        max-width: 42rem;
        padding: 0 1rem;
      }

      form {
        display: grid;
        gap: 1rem;
      }

      label {
        display: grid;
        gap: 0.25rem;
      }

      input,
      select,
      button {
        font: inherit;
        padding: 0.55rem;
      }

      .confirmation {
        background: #eafaf1;
        border: 1px solid #239b56;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Synthetic Broker removal form</h1>
      <p>This page is a local test fixture. It sends no network request.</p>

      <form id="removal-form">
        <label>
          First name
          <input name="firstName" autocomplete="given-name" required />
        </label>

        <label>
          Last name
          <input name="lastName" autocomplete="family-name" required />
        </label>

        <label>
          Email address
          <input name="email" type="email" autocomplete="email" required />
        </label>

        <label>
          Street address
          <input name="address" autocomplete="address-line1" required />
        </label>

        <label>
          City
          <input name="city" autocomplete="address-level2" required />
        </label>

        <label>
          State
          <input name="state" autocomplete="address-level1" required />
        </label>

        <label>
          ZIP code
          <input name="postalCode" autocomplete="postal-code" required />
        </label>

        <label>
          Request type
          <select name="requestType" required>
            <option value="">Choose a request</option>
            <option value="delete">Delete my information</option>
            <option value="suppress">Suppress my listing</option>
          </select>
        </label>

        <label>
          <span>
            <input name="authorized" type="checkbox" required />
            I confirm this is an authorized request
          </span>
        </label>

        <button type="submit">Submit removal request</button>
      </form>

      <p id="confirmation" class="confirmation" role="status" hidden>
        Request received by Synthetic Broker.
      </p>
    </main>

    <script>
      document
        .querySelector("#removal-form")
        .addEventListener("submit", function (event) {
          event.preventDefault();
          event.currentTarget.hidden = true;
          document.querySelector("#confirmation").hidden = false;
        });
    </script>
  </body>
</html>
